services:
  spawnpoint:
    build: .
    container_name: spawnpoint
    restart: unless-stopped
    ports:
      - "40400:40400"       # Web UI
      - "8211:8211/udp"     # Example: Palworld
      - "2456-2458:2456-2458/udp"  # Example: Valheim
      # Add more game server ports as needed
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - ./SteamCMD:/opt/spawnpoint/SteamCMD    # Server configs (servers.json)
      - steam_cache:/home/steam/Steam            # SteamCMD cache
      - games_data:/opt/spawnpoint/games         # Installed game servers
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:40400')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

volumes:
  steam_cache:
    driver: local
  games_data:
    driver: local