<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>SpawnPoint</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Audiowide&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <!-- Stylesheet -->
  <!-- head: use url_for to reference static assets reliably -->
  <link rel="stylesheet" href="{{ url_for('static', path='style.css') }}">
</head>
<body>
  <div class="container">
    <!-- Left Column - Main Content -->
    <div class="left-column">
      <h1 class="header">SpawnPoint</h1>
      
      <div class="card-grid">
        <!-- Server cards will be inserted here by JS -->
        <div class="game-card add-card">
          <div class="card-border-top"></div>
          <img src="{{ url_for('static', path='spawnpoint_add.jpg') }}" alt="Add New" class="card-image" data-game-image="add-new">
          <div class="card-overlay">
            <div class="card-bottom">
              <button class="card-control" onclick="openAddModal()">
                <span>+</span>
                <span>Add</span>
              </button>
            </div>
          </div>
          <div class="card-border-bottom"></div>
        </div>
      </div>
    </div>

    <div class="column-resizer" id="terminal-resizer" role="separator" aria-label="Resize terminal panel" aria-orientation="vertical" tabindex="0"></div>

    <!-- Right Column - Terminal -->
    <div class="right-column" id="terminal-column">
      <div class="terminal-header">
        <button class="terminal-toggle" id="terminal-toggle" aria-label="Toggle Terminal">
          <span id="toggle-icon">&gt;</span>
        </button>
        <span class="terminal-title">TERMINAL</span>
        <span class="terminal-ip">192.168.1.180:4540</span>
      </div>
      
      <div class="terminal-output" id="terminal-output" aria-live="polite">[connecting to uvicorn logs...]</div>
    </div>
  </div>

  <!-- Add Game Modal -->
  <div id="add-game-modal" class="modal">
    <div class="modal-content">
      <div class="modal-header">
        <h2>Add New Game Server</h2>
        <button class="modal-close" id="close-add-modal">&times;</button>
      </div>
      <div class="modal-body">
        <form id="add-game-form">
          <div class="form-group">
            <label for="app-id">Steam App ID:</label>
            <input type="text" id="app-id" name="appId" required placeholder="e.g., 2394010 for Palworld">
          </div>
          <div class="form-actions">
            <button type="button" class="btn btn-secondary" id="cancel-add-btn">Cancel</button>
            <button type="submit" class="btn btn-primary">Install</button>
          </div>
        </form>
        <div id="add-game-status" class="status-message"></div>
      </div>
    </div>
  </div>

  <!-- Edit Game Modal (COMBINED with image upload) -->
  <div id="edit-game-modal" class="modal">
    <div class="modal-content modal-large">
      <div class="modal-header">
        <h2>Edit Server Settings - <span id="edit-game-name"></span></h2>
        <button class="modal-close" id="close-edit-modal">&times;</button>
      </div>
      <div class="modal-body">
        <form id="edit-game-form">
          <input type="hidden" id="edit-app-id" name="appId">
          
          <div class="form-group">
            <label for="edit-port">Server Port:</label>
            <input type="number" id="edit-port" name="port" placeholder="e.g., 40401">
          </div>
          
          <div class="form-group">
            <label for="edit-install-path">Install Path:</label>
            <input type="text" id="edit-install-path" name="installPath" readonly placeholder="Detected automatically">
          </div>
          
          <div class="form-group">
            <label for="edit-settings-file">Settings File:</label>
            <select id="edit-settings-file" name="settingsFile">
              <option value="">Detecting...</option>
            </select>
          </div>

          <!-- IMAGE UPLOAD SECTION -->
          <div class="form-group">
            <label for="server-image-file">Card image (jpg, png, gif, webm)</label>
            <div style="height:160px; margin-bottom: 8px; border: 1px solid rgba(0, 255, 255, 0.3); border-radius: 4px; overflow: hidden; background: #000;">
              <img id="server-image-preview" src="{{ url_for('static', path='spawnpoint_add.jpg') }}" alt="preview" style="width: 100%; height: 100%; object-fit: cover; display: block;"/>
            </div>
            <input id="server-image-file" type="file" accept=".jpg,.jpeg,.png,.gif,.webm" />
            <div style="margin-top:8px">
              <button id="upload-image-btn" type="button" class="btn btn-secondary btn-sm">Upload image</button>
              <a href="https://www.steamgriddb.com/" target="_blank" rel="noopener noreferrer" style="font-size: 12px; margin-left: 8px;">Can't find one? Check steamgriddb.com</a>
            </div>
          </div>
          
          <div class="form-group">
            <label>Version Info:</label>
            <div class="version-info">
              <span id="current-version">Current: Loading...</span>
              <button type="button" class="btn btn-secondary btn-sm" id="check-version-btn">Check for Updates</button>
            </div>
          </div>
          
          <div class="form-actions">
            <button type="button" class="btn btn-secondary" id="cancel-edit-btn">Cancel</button>
            <button type="submit" class="btn btn-primary">Save</button>
          </div>
        </form>
        <div id="edit-game-status" class="status-message"></div>
      </div>
    </div>
  </div>

  <script>
    // Apply background images from Jinja2 template variables
    const noiseUrl = '{{ url_for("static", path="noise.gif") }}';
    const lineBgUrl = '{{ url_for("static", path="line-BG.png") }}';
    const spawnpointAddUrl = '{{ url_for("static", path="spawnpoint_add.jpg") }}';
    
    // Set noise background
    if (noiseUrl) {
      const bodyBefore = document.createElement('style');
      bodyBefore.textContent = `body::before { background-image: url("${noiseUrl}"); }`;
      document.head.appendChild(bodyBefore);
    }
    
    // Set line borders on cards
    if (lineBgUrl) {
      const borderStyle = document.createElement('style');
      borderStyle.textContent = `.card-border-top, .card-border-bottom { background-image: url("${lineBgUrl}"); }`;
      document.head.appendChild(borderStyle);
    }

    // Apply game card images (using spawnpoint_add as placeholder)
    document.querySelectorAll('[data-game-image]').forEach(img => {
      if (spawnpointAddUrl) {
        img.src = spawnpointAddUrl;
      }
    });

    // Modal Management
    const addGameModal = document.getElementById('add-game-modal');
    const editGameModal = document.getElementById('edit-game-modal');
    const addGameBtn = document.getElementById('add-game-btn');
    const closeAddModal = document.getElementById('close-add-modal');
    const closeEditModalBtn = document.getElementById('close-edit-modal');
    const cancelAddBtn = document.getElementById('cancel-add-btn');
    const cancelEditBtn = document.getElementById('cancel-edit-btn');

    function openAddModal() {
      if (!addGameModal) return;
      addGameModal.style.display = 'flex';
      document.getElementById('app-id')?.focus();
    }

    function closeAddModalHandler() {
      if (!addGameModal) return;
      addGameModal.style.display = 'none';
      document.getElementById('add-game-form').reset();
      document.getElementById('add-game-status').textContent = '';
    }

    function closeEditModal() {
      if (!editGameModal) return;
      editGameModal.style.display = 'none';
      document.getElementById('edit-game-form').reset();
      document.getElementById('edit-game-status').textContent = '';
      delete editGameModal.dataset.appid;
    }

    function openEditModal(serverData) {
      if (!editGameModal) return;
      const server = typeof serverData === 'string' ? JSON.parse(serverData) : serverData || {};
      editGameModal.style.display = 'flex';
      editGameModal.dataset.appid = server.appId ?? '';

      document.getElementById('edit-game-name').textContent = server.name || server.appId || '';
      document.getElementById('edit-app-id').value = server.appId || '';
      document.getElementById('edit-port').value = server.port ?? '';
      document.getElementById('edit-install-path').value = server.installPath || '';
      const settingsSelect = document.getElementById('edit-settings-file');
      if (settingsSelect && server.settingsFile) settingsSelect.value = server.settingsFile;
      document.getElementById('current-version').textContent = `Current: ${server.version || 'unknown'}`;
      document.getElementById('server-image-preview').src = server.image || spawnpointAddUrl;
    }

    closeAddModal?.addEventListener('click', closeAddModalHandler);
    cancelAddBtn?.addEventListener('click', closeAddModalHandler);
    closeEditModalBtn?.addEventListener('click', closeEditModal);
    cancelEditBtn?.addEventListener('click', closeEditModal);

    // Close modals on outside click
    window.addEventListener('click', (e) => {
      if (e.target === addGameModal) closeAddModalHandler();
      if (e.target === editGameModal) closeEditModal();
    });

    // Handle Add Game Form Submission
    document.getElementById('add-game-form')?.addEventListener('submit', async (e) => {
      e.preventDefault();
      const appId = document.getElementById('app-id').value;
      const statusEl = document.getElementById('add-game-status');
      
      statusEl.textContent = 'Installing...';
      statusEl.className = 'status-message status-info';
      
      try {
        const response = await fetch('/api/servers/add', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ appId })
        });
        
        const result = await response.json();
        
        if (response.ok) {
          statusEl.textContent = 'Installation successful!';
          statusEl.className = 'status-message status-success';
          
          setTimeout(() => {
            addGameModal.style.display = 'none';
            document.getElementById('add-game-form').reset();
            statusEl.textContent = '';
            loadServers(); // Refresh the card grid
          }, 1500);
        } else {
          statusEl.textContent = `Error: ${result.error || 'Installation failed'}`;
          statusEl.className = 'status-message status-error';
        }
      } catch (error) {
        statusEl.textContent = `Error: ${error.message}`;
        statusEl.className = 'status-message status-error';
      }
    });

    // Handle Edit Game Form Submission
    document.getElementById('edit-game-form')?.addEventListener('submit', async (e) => {
      e.preventDefault();
      const appId = document.getElementById('edit-app-id').value;
      const port = document.getElementById('edit-port').value;
      const settingsFile = document.getElementById('edit-settings-file').value;
      const statusEl = document.getElementById('edit-game-status');
      
      statusEl.textContent = 'Saving...';
      statusEl.className = 'status-message status-info';
      
      try {
        const response = await fetch(`/api/servers/${appId}`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ port, settingsFile })
        });
        
        const result = await response.json();
        
        if (response.ok) {
          statusEl.textContent = 'Settings saved!';
          statusEl.className = 'status-message status-success';
          
          setTimeout(() => {
            editGameModal.style.display = 'none';
            document.getElementById('edit-game-form').reset();
            statusEl.textContent = '';
            loadServers(); // Refresh the card grid
          }, 1500);
        } else {
          statusEl.textContent = `Error: ${result.error || 'Save failed'}`;
          statusEl.className = 'status-message status-error';
        }
      } catch (error) {
        statusEl.textContent = `Error: ${error.message}`;
        statusEl.className = 'status-message status-error';
      }
    });

    // Check Version Button
    document.getElementById('check-version-btn')?.addEventListener('click', async () => {
      const appId = document.getElementById('edit-app-id').value;
      const versionEl = document.getElementById('current-version');
      const btn = document.getElementById('check-version-btn');
      
      btn.disabled = true;
      btn.textContent = 'Checking...';
      
      try {
        const response = await fetch(`/api/servers/${appId}/version`);
        const result = await response.json();
        
        if (response.ok) {
          versionEl.textContent = `Current: ${result.current} | Latest: ${result.latest}`;
          if (result.updateAvailable) {
            versionEl.textContent += ' (Update Available)';
          }
        } else {
          versionEl.textContent = 'Error checking version';
        }
      } catch (error) {
        versionEl.textContent = 'Error checking version';
      } finally {
        btn.disabled = false;
        btn.textContent = 'Check for Updates';
      }
    });

    // Load and render server cards
    async function loadServers() {
      try {
        const response = await fetch('/api/servers');
        const servers = await response.json();
        
        const cardGrid = document.querySelector('.card-grid');
        if (!cardGrid) {
          console.error('Card grid not found');
          return;
        }
        
        // Clear existing cards (except add button)
        cardGrid.querySelectorAll('.game-card:not(.add-card)').forEach(card => card.remove());
        
        // Render each server
        servers.forEach(server => {
          const card = createServerCard(server);
          // Insert before the add card
          const addCard = cardGrid.querySelector('.add-card');
          if (addCard) {
            cardGrid.insertBefore(card, addCard);
          } else {
            cardGrid.appendChild(card);
          }
        });
      } catch (error) {
        console.error('Failed to load servers:', error);
      }
    }

    // Create a server card element
    function createServerCard(server) {
      const card = document.createElement('div');
      card.className = 'game-card';
      card.setAttribute('data-app-id', server.appId);
      
      const imageUrl = server.image || spawnpointAddUrl;
      
      card.innerHTML = `
        <div class="card-border-top"></div>
        <a href="#" class="gear-icon" onclick="event.preventDefault(); openEditModal(${JSON.stringify(server).replace(/"/g, '&quot;')})">
          <svg viewBox="0 0 24 24" fill="currentColor">
            <path d="M12 15.5A3.5 3.5 0 1 0 12 8.5a3.5 3.5 0 0 0 0 7z"/>
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09a1.65 1.65 0 0 0-1-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06A2 2 0 1 1 2.3 17.9l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09c.65 0 1.2-.4 1.51-1a1.65 1.65 0 0 0-.33-1.82L4.3 6.7A2 2 0 1 1 7.13 3.9l.06.06c.5.5 1.23.67 1.82.33.36-.22.76-.34 1.18-.34H12a2 2 0 1 1 4 0h.09c.42 0 .82.11 1.18.34.59.34 1.32.17 1.82-.33l.06-.06A2 2 0 1 1 21.7 6.7l-.06.06c-.22.36-.34.76-.34 1.18V9c0 .5.13.99.34 1.46"/>
          </svg>
        </a>
        <img src="${imageUrl}" alt="${server.name}" class="card-image" data-server="${server.appId}">
        <div class="card-overlay">
          <div class="card-top-info">
            <div class="card-title">${server.name.toUpperCase()}</div>
            <div class="card-subtitle">${server.ip || 'No IP set'}</div>
          </div>
          <div class="card-bottom">
            <div class="card-bottom-row">
              <button class="card-control" onclick="controlServer('${server.appId}', '${server.status === 'running' ? 'stop' : 'start'}')">
                <span>${server.status === 'running' ? '■' : '▶'}</span>
                <span>${server.status === 'running' ? 'Stop' : 'Start'}</span>
              </button>
              <div class="card-status-info">Status: ${server.status || 'unknown'}</div>
            </div>
            <div class="card-version-info">Ver: ${server.version || '?'} (Current)</div>
          </div>
        </div>
        <div class="card-border-bottom"></div>
      `;
      
      return card;
    }

    // Call on page load
    loadServers();

    // Refresh every 5 seconds
    setInterval(loadServers, 5000);

    // Terminal toggle functionality
    const terminalColumn = document.getElementById('terminal-column');
    const terminalToggle = document.getElementById('terminal-toggle');
    const toggleIcon = document.getElementById('toggle-icon');
    const resizer = document.getElementById('terminal-resizer');

    const MIN_TERMINAL_WIDTH = 240;
    const MAX_TERMINAL_WIDTH = 800;
    const RESIZE_HANDLE_WIDTH = 18;
    let lastExpandedWidth = terminalColumn?.getBoundingClientRect().width || 400;

    terminalToggle?.addEventListener('click', () => {
      if (!terminalColumn) {
        return;
      }

      const currentlyCollapsed = terminalColumn.classList.contains('collapsed');
      if (!currentlyCollapsed) {
        lastExpandedWidth = terminalColumn.getBoundingClientRect().width;
      }

      terminalColumn.classList.toggle('collapsed');
      const isCollapsed = terminalColumn.classList.contains('collapsed');

      if (isCollapsed) {
        toggleIcon.textContent = '<';
        terminalColumn.style.width = '';
        resizer?.setAttribute('data-collapsed', 'true');
        if (resizer) {
          resizer.style.cursor = 'default';
        }
      } else {
        const widthToRestore = Math.max(MIN_TERMINAL_WIDTH, Math.min(MAX_TERMINAL_WIDTH, lastExpandedWidth));
        terminalColumn.style.width = `${widthToRestore}px`;
        toggleIcon.textContent = '>';
        resizer?.removeAttribute('data-collapsed');
        if (resizer) {
          resizer.style.cursor = 'col-resize';
        }
      }
    });

    if (resizer && terminalColumn) {
      let isResizing = false;
      let startX = 0;
      let startWidth = 0;

      const onPointerMove = (event) => {
        if (!isResizing) {
          return;
        }

        const clientX = event.touches ? event.touches[0].clientX : event.clientX;
        const delta = startX - clientX;
        let nextWidth = startWidth + delta;
        nextWidth = Math.max(MIN_TERMINAL_WIDTH, Math.min(MAX_TERMINAL_WIDTH, nextWidth));

        terminalColumn.style.width = `${nextWidth}px`;
        lastExpandedWidth = nextWidth;
      };

      const stopResize = () => {
        if (!isResizing) {
          return;
        }

        isResizing = false;
        document.removeEventListener('mousemove', onPointerMove);
        document.removeEventListener('mouseup', stopResize);
        document.removeEventListener('touchmove', onPointerMove);
        document.removeEventListener('touchend', stopResize);
        resizer.classList.remove('is-active');
        document.body.style.userSelect = '';
        document.body.style.cursor = '';
        resizer.style.cursor = 'col-resize';
      };

      const startResize = (event) => {
        if (terminalColumn.classList.contains('collapsed')) {
          return;
        }

        const clientX = event.touches ? event.touches[0].clientX : event.clientX;
        const rect = terminalColumn.getBoundingClientRect();
        const withinHandle = clientX >= rect.left - RESIZE_HANDLE_WIDTH / 2 && clientX <= rect.left + RESIZE_HANDLE_WIDTH / 2;

        if (!withinHandle) {
          return;
        }

        isResizing = true;
        startX = event.touches ? event.touches[0].clientX : event.clientX;
        startWidth = terminalColumn.getBoundingClientRect().width;
        resizer.classList.add('is-active');

        document.addEventListener('mousemove', onPointerMove);
        document.addEventListener('mouseup', stopResize);
        document.addEventListener('touchmove', onPointerMove);
        document.addEventListener('touchend', stopResize);

        document.body.style.userSelect = 'none';
        document.body.style.cursor = 'col-resize';
        event.preventDefault();
      };

      resizer.addEventListener('mousedown', startResize);
      resizer.addEventListener('touchstart', startResize, { passive: false });
    }

    // Terminal log polling
    const terminalOutput = document.getElementById('terminal-output');
    
    function fetchLogs() {
      fetch('/uvicorn/logs')
        .then(response => response.text())
        .then(logs => {
          if (terminalOutput) {
            terminalOutput.textContent = logs || '[no logs available]';
            terminalOutput.scrollTop = terminalOutput.scrollHeight;
          }
        })
        .catch(err => {
          console.error('Failed to fetch logs:', err);
        });
    }

    setInterval(fetchLogs, 2000);
    fetchLogs();

    // Upload handler
    document.getElementById('upload-image-btn')?.addEventListener('click', async () => {
      if (!editGameModal) {
        alert('No server selected');
        return;
      }
      const appId = editGameModal.dataset.appid;
      if (!appId) {
        alert('No server selected');
        return;
      }

      const fileInput = document.getElementById('server-image-file');
      const file = fileInput?.files?.[0];
      if (!file) {
        alert('Choose a file first');
        return;
      }

      const allowed = ['image/jpeg', 'image/png', 'image/gif', 'video/webm'];
      if (!allowed.includes(file.type)) {
        alert('Unsupported file type. Allowed: jpg, png, gif, webm');
        return;
      }

      const fd = new FormData();
      fd.append('file', file, file.name);

      try {
        const res = await fetch(`/api/servers/${encodeURIComponent(appId)}/image`, {
          method: 'POST',
          body: fd
        });
        if (!res.ok) {
          const err = await res.json().catch(() => ({ error: res.statusText }));
          alert('Upload failed: ' + (err.error || res.statusText));
          return;
        }
        const body = await res.json();
        const newUrl = body.image ? `${body.image}?t=${Date.now()}` : spawnpointAddUrl;

        const previewEl = document.getElementById('server-image-preview');
        if (previewEl) previewEl.src = newUrl;

        const cardImg = document.querySelector(`img[data-server="${appId}"]`);
        if (cardImg) cardImg.src = newUrl;

        fileInput.value = '';
      } catch (error) {
        console.error('Upload failed', error);
        alert('Upload failed. See console for details.');
      }
    });

    // Server control functions
    async function controlServer(appId, action) {
      try {
        const response = await fetch(`/api/servers/${appId}/${action}`, {
          method: 'POST'
        });
        const result = await response.json();
        if (!response.ok) {
          alert(`Failed to ${action}: ${result.error || 'Unknown error'}`);
        }
        // Reload servers to update status
        setTimeout(loadServers, 1000);
      } catch (error) {
        console.error(`Failed to ${action} server:`, error);
        alert(`Failed to ${action} server`);
      }
    }
  </script>
</body>
</html>
