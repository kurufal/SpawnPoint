<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>SpawnPoint</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Audiowide&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <!-- Stylesheet -->
  <link rel="stylesheet" href="/static/style.css?v=2">
</head>
<body>
  <div class="container">
    <!-- Left Column - Main Content -->
    <div class="left-column">
      <h1 class="header">SpawnPoint</h1>
      
      <div class="card-grid">
        <!-- Card 1: Palworld -->
        <div class="game-card">
          <div class="card-border-top"></div>
          
          <img src="" alt="Palworld" class="card-image" data-game-image="palworld">
          
          <a href="#" class="gear-icon" aria-label="Settings">
            <svg viewBox="0 0 24 24" fill="currentColor">
              <path d="M12 15.5A3.5 3.5 0 1 0 12 8.5a3.5 3.5 0 0 0 0 7z"/>
              <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09a1.65 1.65 0 0 0-1-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06A2 2 0 1 1 2.3 17.9l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09c.65 0 1.2-.4 1.51-1a1.65 1.65 0 0 0-.33-1.82L4.3 6.7A2 2 0 1 1 7.13 3.9l.06.06c.5.5 1.23.67 1.82.33.36-.22.76-.34 1.18-.34H12a2 2 0 1 1 4 0h.09c.42 0 .82.11 1.18.34.59.34 1.32.17 1.82-.33l.06-.06A2 2 0 1 1 21.7 6.7l-.06.06c-.22.36-.34.76-.34 1.18V9c0 .5.13.99.34 1.46"/>
            </svg>
          </a>
          
          <div class="card-overlay">
            <div class="card-top-info">
              <div class="card-title">PALWORLD</div>
              <div class="card-subtitle">192.168.1.160:40401</div>
            </div>
            
            <div class="card-bottom">
              <div class="card-bottom-row">
                <button class="card-control">
                  <span>■</span>
                  <span>Stop</span>
                </button>
                <div class="card-status-info">Status: Running</div>
              </div>
              <div class="card-version-info">Ver: 6.0.4 (Update Avail...)</div>
            </div>
          </div>
          
          <div class="card-border-bottom"></div>
        </div>

        <!-- Card 2: Enshrouded -->
        <div class="game-card">
          <div class="card-border-top"></div>
          
          <img src="" alt="Enshrouded" class="card-image" data-game-image="enshrouded">
          
          <a href="#" class="gear-icon" aria-label="Settings">
            <svg viewBox="0 0 24 24" fill="currentColor">
              <path d="M12 15.5A3.5 3.5 0 1 0 12 8.5a3.5 3.5 0 0 0 0 7z"/>
              <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09a1.65 1.65 0 0 0-1-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06A2 2 0 1 1 2.3 17.9l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09c.65 0 1.2-.4 1.51-1a1.65 1.65 0 0 0-.33-1.82L4.3 6.7A2 2 0 1 1 7.13 3.9l.06.06c.5.5 1.23.67 1.82.33.36-.22.76-.34 1.18-.34H12a2 2 0 1 1 4 0h.09c.42 0 .82.11 1.18.34.59.34 1.32.17 1.82-.33l.06-.06A2 2 0 1 1 21.7 6.7l-.06.06c-.22.36-.34.76-.34 1.18V9c0 .5.13.99.34 1.46"/>
            </svg>
          </a>
          
          <div class="card-overlay">
            <div class="card-top-info">
              <div class="card-title">ENSHROUDED</div>
              <div class="card-subtitle">192.168.1.160:40402</div>
            </div>
            
            <div class="card-bottom">
              <div class="card-bottom-row">
                <button class="card-control">
                  <span>▶</span>
                  <span>Start</span>
                </button>
                <div class="card-status-info">Status: Stopped</div>
              </div>
              <div class="card-version-info">Ver: 2.0.0 (Current)</div>
            </div>
          </div>
          
          <div class="card-border-bottom"></div>
        </div>

        <!-- Card 3: Add New -->
        <div class="game-card add-card">
          <div class="card-border-top"></div>
          
          <img src="" alt="Add New" class="card-image" data-game-image="add-new">
          
          <div class="card-overlay">
            <div class="card-bottom">
              <button class="card-control">
                <span>+</span>
                <span>Add</span>
              </button>
            </div>
          </div>
          
          <div class="card-border-bottom"></div>
        </div>
      </div>
    </div>

    <div class="column-resizer" id="terminal-resizer" role="separator" aria-label="Resize terminal panel" aria-orientation="vertical" tabindex="0"></div>

    <!-- Right Column - Terminal -->
    <div class="right-column" id="terminal-column">
      <div class="terminal-header">
        <button class="terminal-toggle" id="terminal-toggle" aria-label="Toggle Terminal">
          <span id="toggle-icon">&gt;</span>
        </button>
        <span class="terminal-title">TERMINAL</span>
        <span class="terminal-ip">192.168.1.180:4540</span>
      </div>
      
      <div class="terminal-output" id="terminal-output" aria-live="polite">[connecting to uvicorn logs...]</div>
    </div>
  </div>

  <script>
    // Apply background images from Jinja2 template variables
    const noiseUrl = '{{ request.url_for("static", path="noise.gif") }}';
    const lineBgUrl = '{{ request.url_for("static", path="line-BG.png") }}';
    const spawnpointAddUrl = '{{ request.url_for("static", path="spawnpoint_add.jpg") }}';
    
    // Set noise background
    if (noiseUrl) {
      const bodyBefore = document.createElement('style');
      bodyBefore.textContent = `body::before { background-image: url("${noiseUrl}"); }`;
      document.head.appendChild(bodyBefore);
    }
    
    // Set line borders on cards
    if (lineBgUrl) {
      const borderStyle = document.createElement('style');
      borderStyle.textContent = `.card-border-top, .card-border-bottom { background-image: url("${lineBgUrl}"); }`;
      document.head.appendChild(borderStyle);
    }

    // Apply game card images (using spawnpoint_add as placeholder)
    document.querySelectorAll('[data-game-image]').forEach(img => {
      if (spawnpointAddUrl) {
        img.src = spawnpointAddUrl;
      }
    });

    // Terminal toggle functionality
    const terminalColumn = document.getElementById('terminal-column');
    const terminalToggle = document.getElementById('terminal-toggle');
    const toggleIcon = document.getElementById('toggle-icon');
    const resizer = document.getElementById('terminal-resizer');

    const MIN_TERMINAL_WIDTH = 240;
    const MAX_TERMINAL_WIDTH = 800;
    const RESIZE_HANDLE_WIDTH = 18;
    let lastExpandedWidth = terminalColumn?.getBoundingClientRect().width || 400;

    terminalToggle?.addEventListener('click', () => {
      if (!terminalColumn) {
        return;
      }

      const currentlyCollapsed = terminalColumn.classList.contains('collapsed');
      if (!currentlyCollapsed) {
        lastExpandedWidth = terminalColumn.getBoundingClientRect().width;
      }

      terminalColumn.classList.toggle('collapsed');
      const isCollapsed = terminalColumn.classList.contains('collapsed');

      if (isCollapsed) {
        toggleIcon.textContent = '<';
        terminalColumn.style.width = '';
        resizer?.setAttribute('data-collapsed', 'true');
        if (resizer) {
          resizer.style.cursor = 'default';
        }
      } else {
        const widthToRestore = Math.max(MIN_TERMINAL_WIDTH, Math.min(MAX_TERMINAL_WIDTH, lastExpandedWidth));
        terminalColumn.style.width = `${widthToRestore}px`;
        toggleIcon.textContent = '>';
        resizer?.removeAttribute('data-collapsed');
        if (resizer) {
          resizer.style.cursor = 'col-resize';
        }
      }
    });

    if (resizer && terminalColumn) {
      let isResizing = false;
      let startX = 0;
      let startWidth = 0;

      const onPointerMove = (event) => {
        if (!isResizing) {
          return;
        }

        const clientX = event.touches ? event.touches[0].clientX : event.clientX;
        const delta = startX - clientX;
        let nextWidth = startWidth + delta;
        nextWidth = Math.max(MIN_TERMINAL_WIDTH, Math.min(MAX_TERMINAL_WIDTH, nextWidth));

        terminalColumn.style.width = `${nextWidth}px`;
        lastExpandedWidth = nextWidth;
      };

      const stopResize = () => {
        if (!isResizing) {
          return;
        }

        isResizing = false;
        document.removeEventListener('mousemove', onPointerMove);
        document.removeEventListener('mouseup', stopResize);
        document.removeEventListener('touchmove', onPointerMove);
        document.removeEventListener('touchend', stopResize);
        resizer.classList.remove('is-active');
        document.body.style.userSelect = '';
        document.body.style.cursor = '';
        resizer.style.cursor = 'col-resize';
      };

      const startResize = (event) => {
        if (terminalColumn.classList.contains('collapsed')) {
          return;
        }

        const clientX = event.touches ? event.touches[0].clientX : event.clientX;
        const rect = terminalColumn.getBoundingClientRect();
        const withinHandle = clientX >= rect.left - RESIZE_HANDLE_WIDTH / 2 && clientX <= rect.left + RESIZE_HANDLE_WIDTH / 2;

        if (!withinHandle) {
          return;
        }

        isResizing = true;
        startX = event.touches ? event.touches[0].clientX : event.clientX;
        startWidth = terminalColumn.getBoundingClientRect().width;
        resizer.classList.add('is-active');

        document.addEventListener('mousemove', onPointerMove);
        document.addEventListener('mouseup', stopResize);
        document.addEventListener('touchmove', onPointerMove);
        document.addEventListener('touchend', stopResize);

        document.body.style.userSelect = 'none';
        document.body.style.cursor = 'col-resize';
        event.preventDefault();
      };

      resizer.addEventListener('mousedown', startResize);
      resizer.addEventListener('touchstart', startResize, { passive: false });
    }

    // Terminal log polling
    const terminalOutput = document.getElementById('terminal-output');
    
    function fetchLogs() {
      fetch('/uvicorn/logs')
        .then(response => response.text())
        .then(logs => {
          if (terminalOutput) {
            terminalOutput.textContent = logs || '[no logs available]';
            // Auto-scroll to bottom
            terminalOutput.scrollTop = terminalOutput.scrollHeight;
          }
        })
        .catch(err => {
          console.error('Failed to fetch logs:', err);
        });
    }

    // Poll logs every 2 seconds
    setInterval(fetchLogs, 2000);
    fetchLogs(); // Initial fetch
  </script>
</body>
</html>
